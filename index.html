  <body data-page="home">
    <main>
      <section class="hero" aria-label="Introduction">
        <div class="hero__image">
          <div class="slot slot--contain" data-hero-stage>
            <img
              class="hero__slide is-active"
              data-layer="a"
              src="assets/work/dragon-thigh.jpeg"
              alt="Dragon with outstretched wing on the thigh"
            />
            <img class="hero__slide" data-layer="b" src="" alt="" aria-hidden="true" />
          </div>
        </div>
        <div class="hero__scrim"></div>

        <div class="hero__inner">
          <header class="hero__top">
            <a class="hero__mark" href="index.html">Noah Rasmus</a>
            <nav class="nb hero__nav" aria-label="Primary" data-partial="hero-nav"></nav>
          </header>

          <div class="hero__content">
            <h1 class="wm hero__title">Noah<br />Rasmus</h1>
            <p class="hero__lede">
              Black and grey realism tattoo artist in Camp Hill, Pennsylvania.
              High-contrast, custom work drawn for the body it sits on.
            </p>
            <div class="hero__cta">
              <a class="btn btn-primary" href="work.html">See the work</a>
              <a class="btn btn-ghost" href="contact.html">Get in touch</a>
            </div>
          </div>
        </div>
      </section>

      <div class="slider-progress" aria-hidden="true">
        <div class="slider-progress__bar" data-progress></div>
      </div>

      <section class="recent" aria-label="Recent work" data-recent-strip>
        <div class="slot slot--contain"><img src="" alt="" /></div>
        <div class="slot slot--contain"><img src="" alt="" /></div>
        <div class="slot slot--contain"><img src="" alt="" /></div>
        <div class="slot slot--contain"><img src="" alt="" /></div>

      <div class="recent-caption">
        <span>Recent work</span>
        <span>Updated monthly</span>
      </div>

      <a class="preview-link" href="work.html" aria-label="See all work">
        <section class="preview">
          <div class="grid preview__grid" data-preview-grid></div>
          <div class="preview__overlay" aria-hidden="true">
            <span class="preview__cta">See all work →</span>
          </div>
        </section>
