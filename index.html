<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="description"
      content="Noah Rasmus — black and grey tattooing. Graphic, heavy on contrast, drawn for the body it sits on."

    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-label="Introduction">
        <div class="hero__image">
          <div class="slot slot--contain" data-hero-stage>
            <img
              class="hero__slide is-active"
              data-layer="a"
              src="assets/tattoo-01.jpeg"
              alt="Skeletal hand wrapped by a snake and rose"
            />
            <img class="hero__slide" data-layer="b" src="" alt="" aria-hidden="true" />
          </div>
        </div>
        <div class="hero__scrim"></div>

        <div class="hero__inner">
          <header class="hero__top">
            <div class="hero__mark">N. Rasmus</div>
            <nav class="nb hero__nav" aria-label="Primary">
              <a href="work.html">Work</a>
              <a href="about.html">About</a>
              <a href="contact.html">Contact</a>
            </nav>
          </header>

          <div class="hero__content">
            <h1 class="wm hero__title">Noah<br />Rasmus</h1>
            <p class="hero__lede">
              Black and grey tattooing. Graphic, heavy on contrast, drawn for the
              body it sits on.
            </p>
            <div class="hero__cta">
              <a class="btn btn-primary" href="work.html">See the work</a>
              <a class="btn btn-ghost" href="contact.html">Get in touch</a>
            </div>
          </div>
        </div>
      </section>

      <div class="slider-progress" aria-hidden="true">
        <div class="slider-progress__bar" data-progress></div>
      </div>

      <section class="recent" aria-label="Recent work" data-recent-strip>
        <div class="slot slot--contain"><img src="" alt="" /></div>
        <div class="slot slot--contain"><img src="" alt="" /></div>
        <div class="slot slot--contain"><img src="" alt="" /></div>
        <div class="slot slot--contain"><img src="" alt="" /></div>
      </section>

      <div class="recent-caption">
        <span>Recent work</span>
        <span>Updated monthly</span>
      </div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
